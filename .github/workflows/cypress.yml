name: Cypress Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, qa, prod]
      test_scope:
        description: Test scope
        required: true
        default: smoke
        type: choice
        options: [smoke, e2e, all]
      task_id:
        description: Verified task id (optional; only for task/* work)
        required: false
        type: string

env:
  NODE_VERSION: "24"

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # task:check diffs task.verifiedCommit..HEAD. The documented flow
          # commits the verified manifest AFTER verify, so that SHA is a
          # parent of HEAD. Default fetch-depth: 1 cannot see it and the
          # job dies before tests run.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify task manifest
        if: ${{ inputs.task_id != '' || startsWith(github.head_ref, 'task/') || startsWith(github.ref_name, 'task/') }}
        run: npm run task:check -- --id "${{ inputs.task_id }}"
      - name: Write runtime configuration
        # BASE_URL is a non-secret public target for this project (Automation Exercise). A repo
        # secret or variable named BASE_URL still overrides it for private environments.
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL || 'https://www.automationexercise.com' }}
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          CYPRESS_AUTH_URL: ${{ secrets.CYPRESS_AUTH_URL }}
        run: >-
          node -e
          "require('node:fs').writeFileSync('cypress.env.json',
          JSON.stringify({baseUrl:process.env.BASE_URL,
          username:process.env.CYPRESS_USERNAME,
          password:process.env.CYPRESS_PASSWORD,
          authUrl:process.env.CYPRESS_AUTH_URL}, null, 2))"
      - name: Run smoke tests
        id: smoke
        run: npm run cy:run:smoke
        env:
          CYPRESS_configFile: ${{ inputs.environment || (github.event_name == 'push' && 'qa') || 'dev' }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      # Feeds M2 (first-pass CI rate). Only attempt 1 counts, so a re-run does not launder a
      # failure into a pass. Runs before evidence:build so M2 includes this run.
      #
      # Classifies from the TEST STEP's outcome, not job.status. job.status is 'failure' whenever
      # anything in the job fails — npm ci, browser install, a dead runner — and recording those as
      # test failures would depress M2 with infrastructure noise. If the tests never ran, the row is
      # marked ENV and evidence.mjs excludes it.
      #
      # NOTE: this writes to the throwaway checkout. The row reaches the uploaded artifact but does
      # NOT persist to the tracked evidence/ci-history.jsonl, and a job that never starts records
      # nothing at all. Backfill from the Actions API is the only mechanism that sees both cases.
      # See docs/START-HERE.md.
      - name: Record first-attempt CI outcome for M2
        if: always() && github.run_attempt == 1
        env:
          TEST_OUTCOME: ${{ steps.smoke.outcome }}
          TRIGGER: ${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && 'push' || 'manual') }}
        run: |
          case "$TEST_OUTCOME" in
            success) CLASS="" ; RESULT="passed" ;;
            failure) CLASS="" ; RESULT="failed" ;;
            *)       CLASS="--failure-class ENV" ; RESULT="failed" ;;
          esac
          node scripts/record-evidence.mjs ci \
            --pipeline "${{ github.run_id }}" \
            --trigger "$TRIGGER" \
            --attempt "${{ github.run_attempt }}" \
            --outcome "$RESULT" $CLASS
      - name: Build machine evidence
        if: always()
        run: npm run evidence:build
      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            cypress/reports/html/
            cypress/screenshots/
            evidence/

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: smoke
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment != 'prod' &&
       (inputs.test_scope == 'e2e' || inputs.test_scope == 'all'))
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Write runtime configuration
        # BASE_URL is a non-secret public target for this project (Automation Exercise). A repo
        # secret or variable named BASE_URL still overrides it for private environments.
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL || 'https://www.automationexercise.com' }}
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
          CYPRESS_AUTH_URL: ${{ secrets.CYPRESS_AUTH_URL }}
        run: >-
          node -e
          "require('node:fs').writeFileSync('cypress.env.json',
          JSON.stringify({baseUrl:process.env.BASE_URL,
          username:process.env.CYPRESS_USERNAME,
          password:process.env.CYPRESS_PASSWORD,
          authUrl:process.env.CYPRESS_AUTH_URL}, null, 2))"
      - name: Run E2E tests
        id: e2e
        run: npm run cy:run:e2e
        env:
          CYPRESS_configFile: ${{ inputs.environment || 'qa' }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      - name: Record first-attempt CI outcome for M2
        if: always() && github.run_attempt == 1
        env:
          TEST_OUTCOME: ${{ steps.e2e.outcome }}
          TRIGGER: ${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && 'push' || 'manual') }}
        run: |
          case "$TEST_OUTCOME" in
            success) CLASS="" ; RESULT="passed" ;;
            failure) CLASS="" ; RESULT="failed" ;;
            *)       CLASS="--failure-class ENV" ; RESULT="failed" ;;
          esac
          node scripts/record-evidence.mjs ci \
            --pipeline "${{ github.run_id }}-e2e" \
            --trigger "$TRIGGER" \
            --attempt "${{ github.run_attempt }}" \
            --outcome "$RESULT" $CLASS
      - name: Build machine evidence
        if: always()
        run: npm run evidence:build
      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            cypress/reports/html/
            cypress/screenshots/
            evidence/
