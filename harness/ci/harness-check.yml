# The harness check every change must pass. Installed as .github/workflows/harness.yml by
# `node scripts/engine/doctor.mjs --heal` (or copy it). Make the `harness` job a required status check in
# branch protection: that is what makes a local `--no-verify` pointless, because the same rules run here.
name: harness
on:
  pull_request:
  push:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the project
        run: npm ci
      - name: GSD Core and the qa-harness capability (conformance I8 needs them)
        run: node scripts/engine/install-gsd.mjs
      - name: Point git at the harness gate, as every clone does
        run: git config core.hooksPath harness/githooks
      - name: Rules on new and changed code (baseline may only shrink, waivers valid)
        if: github.event_name == 'pull_request'
        run: node scripts/engine/check-rules.mjs --base "origin/${{ github.base_ref }}"
      - name: Rules on the whole tree
        if: github.event_name != 'pull_request'
        run: node scripts/engine/check-rules.mjs --all
      - name: Policy and projections match the profile
        run: node scripts/engine/check-drift.mjs
      - name: The project's own standard (lint, type-check, tests)
        run: >-
          node -e "const s=require('./harness.config.json').wiring?.verifyScript;
          if(s){require('child_process').execSync(s,{stdio:'inherit'})}"
      - name: Gaps (also the job summary)
        if: always()
        run: node scripts/engine/doctor.mjs --ci >> "$GITHUB_STEP_SUMMARY"
